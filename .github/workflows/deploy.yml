name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Build
        # No VITE_API_URL — API calls go through the same origin, at /api/*,
        # via a Worker route bound to driveiq.ry-ops.dev/api/*. Cloudflare
        # Access can't selectively bypass a CORS preflight (no HTTP-method
        # rule in its policy builder), so cross-origin credentialed
        # POST/PATCH calls to driveiq-api.ry-ops.dev would 403 on OPTIONS.
        run: npm run build

      # cloudflare/pages-action was retired; every deploy since 2026-09-11 failed.
      - name: Deploy to Cloudflare Pages
        env:
          # wrangler-action installs wrangler into this project; same peer conflict as npm ci.
          npm_config_legacy_peer_deps: 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5dc9134dee1e699eac6044d2c919e3ec
          command: pages deploy dist --project-name=driveiq-ui --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
