name: Deploy to Cloudflare Pages

# Deploys through the shared ry-ops/cf-deploy workflow, so a change on
# Cloudflare's side is fixed there once. Pull requests only build.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    uses: ry-ops/cf-deploy/.github/workflows/pages.yml@c162ab4530c6cf879bb86de7c159db524a0d438f # main 2026-10-18
    with:
      project: driveiq-ui
      account-id: 5dc9134dee1e699eac6044d2c919e3ec
      node-version: '20'
      install-command: npm ci --legacy-peer-deps
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

