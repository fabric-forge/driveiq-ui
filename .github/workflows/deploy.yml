name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Build
        # No VITE_API_URL — API calls go through the same origin, at /api/*,
        # via a Worker route bound to driveiq.ry-ops.dev/api/*. Cloudflare
        # Access can't selectively bypass a CORS preflight (no HTTP-method
        # rule in its policy builder), so cross-origin credentialed
        # POST/PATCH calls to driveiq-api.ry-ops.dev would 403 on OPTIONS.
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@f0a1cd58cd66095dee69bfa18fa5efd1dde93bca # v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5dc9134dee1e699eac6044d2c919e3ec
          projectName: driveiq-ui
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
